name: Cotações

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 min (o GitHub às vezes atrasa alguns minutos)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: cotacoes
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar cotações
        run: python dashboard.py --snapshot

      - name: Publicar quotes.json
        run: |
          git config user.name  "cotacoes-bot"
          git config user.email "cotacoes-bot@users.noreply.github.com"
          git add quotes.json
          git diff --cached --quiet && exit 0
          git commit -m "cotações $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') BRT" -q
          git pull --rebase -q || true
          git push -q
